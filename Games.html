<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>منصة الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#070b10; --panel:rgba(12,20,22,0.86); --panel-border:rgba(93,255,178,0.16);
    --accent:#46ffb0; --accent-dim:#1f8f5f; --accent2:#ffb238; --danger:#ff4d6d;
    --text:#eaf6ef; --text-dim:#86a396;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--bg); font-family:'Cairo',sans-serif; color:var(--text);}
  .num{font-family:'Orbitron',sans-serif;}
  a{color:inherit;}

  header{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; background:rgba(7,11,16,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--panel-border);
  }
  .brand{font-weight:800; font-size:20px; background:linear-gradient(90deg,var(--accent),#8dffce 55%,var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .coin-box{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:8px 16px;}
  .coin-box .coin{font-size:18px;}
  .coin-box .val{font-size:18px; font-weight:800; color:var(--accent2);}

  .offline-banner{
    background:rgba(255,178,56,0.12); border-bottom:1px solid rgba(255,178,56,0.3); color:var(--accent2);
    font-size:12.5px; text-align:center; padding:9px 14px; line-height:1.6;
  }

  main{max-width:1100px; margin:0 auto; padding:20px;}
  .section{margin-bottom:34px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-title{font-size:17px; font-weight:800;}
  .section-lock-note{font-size:12px; color:var(--text-dim);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .card{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .card .icon{font-size:34px;}
  .card .thumb{width:100%; height:110px; object-fit:cover; border-radius:12px; background:rgba(255,255,255,0.04);}
  .card .name{font-weight:800; font-size:15.5px;}
  .card .desc{font-size:12.5px; color:var(--text-dim); line-height:1.6; min-height:34px;}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:100px; width:fit-content;}
  .badge.bonus{background:rgba(255,178,56,0.15); color:var(--accent2); border:1px solid rgba(255,178,56,0.3);}
  .badge.nobonus{background:rgba(255,255,255,0.05); color:var(--text-dim); border:1px solid rgba(255,255,255,0.08);}
  .card-actions{display:flex; gap:8px; margin-top:4px;}
  .btn{flex:1; border:none; border-radius:11px; padding:10px 8px; font-family:'Cairo',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; text-align:center;}
  .btn-play{background:linear-gradient(90deg,var(--accent-dim),var(--accent)); color:#05130c;}
  .btn-lb{background:rgba(255,255,255,0.06); color:var(--text); border:1px solid rgba(255,255,255,0.1);}

  /* locked section overlay */
  .locked-card{
    background:var(--panel); border:1px dashed rgba(255,178,56,0.35); border-radius:16px;
    padding:26px 18px; text-align:center; grid-column:1/-1;
  }
  .locked-card .lock-icon{font-size:30px; margin-bottom:6px;}
  .locked-card .price{color:var(--accent2); font-weight:800; margin:6px 0 14px;}
  .unlock-btn{border:none; border-radius:12px; padding:12px 22px; background:linear-gradient(90deg,#ffb238,#ff8a3d); color:#231303; font-weight:800; cursor:pointer; font-family:'Cairo',sans-serif;}
  .unlock-btn:disabled{opacity:0.45; cursor:not-allowed;}

  /* leaderboard modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:30; padding:20px;}
  .hidden{display:none !important;}
  .modal{background:var(--panel); border:1px solid var(--panel-border); border-radius:18px; padding:22px; max-width:380px; width:100%; max-height:80vh; overflow-y:auto;}
  .modal h3{margin:0 0 14px; font-size:16px;}
  .lb-row{display:flex; align-items:center; justify-content:space-between; gap:8px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:8px 12px; font-size:13px; margin-bottom:6px;}
  .lb-rank{min-width:28px; font-weight:800; color:var(--accent2);}
  .lb-name{flex:1; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lb-time{color:var(--accent); font-weight:700;}
  .lb-empty{font-size:12.5px; color:var(--text-dim); text-align:center; padding:14px 0;}
  .modal-close{width:100%; margin-top:12px; border:1px solid rgba(255,255,255,0.12); background:transparent; color:var(--text); border-radius:11px; padding:10px; cursor:pointer; font-family:'Cairo',sans-serif; font-weight:700;}

  .empty-note{color:var(--text-dim); font-size:13px; text-align:center; padding:40px 0;}
</style>
</head>
<body>

<header>
  <div class="brand">🎮 منصة الألعاب</div>
  <div class="coin-box"><span class="coin">🪙</span><span class="val num" id="coinVal">0</span></div>
</header>

<div class="offline-banner hidden" id="offlineBanner">🔌 لا يوجد اتصال بالإنترنت — البيانات المعروضة نسخة محفوظة مؤقتًا محليًا وقد لا تكون محدّثة، ستُحدَّث تلقائيًا عند عودة الاتصال.</div>

<main id="sectionsRoot">
  <div class="empty-note">جارِ تحميل الألعاب...</div>
</main>

<div class="modal-bg hidden" id="lbModal">
  <div class="modal">
    <h3 id="lbModalTitle">🏆 المتصدرون</h3>
    <div id="lbModalBody"><div class="lb-empty">جارِ التحميل...</div></div>
    <button class="modal-close" id="lbModalClose">إغلاق</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================= FIREBASE (RTDB, public db — databaseURL only) ============================= */
const firebaseConfig = { databaseURL: "https://umlog-box-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================= BONUS COINS (shared, localStorage) ============================= */
const BONUS_KEY = 'bonusGames';
const UNLOCKED_KEY = 'unlockedSections';
function getBonus(){ const v = parseInt(localStorage.getItem(BONUS_KEY),10); return Number.isFinite(v)?v:0; }
function setBonus(v){ localStorage.setItem(BONUS_KEY, String(Math.max(0,v))); renderCoin(); }
function getUnlocked(){ try{ return JSON.parse(localStorage.getItem(UNLOCKED_KEY)||'[]'); }catch(e){ return []; } }
function setUnlocked(arr){ localStorage.setItem(UNLOCKED_KEY, JSON.stringify(arr)); }
function isUnlocked(sectionId, price){ return price<=0 || getUnlocked().includes(sectionId); }
function unlockSection(sectionId, price){
  const bal = getBonus();
  if(bal < price) return false;
  setBonus(bal - price); // "spending" the price — becomes 0 when price === full balance
  const arr = getUnlocked(); arr.push(sectionId); setUnlocked(arr);
  return true;
}
function renderCoin(){ document.getElementById('coinVal').textContent = getBonus(); }

/* ============================= DATA LOAD (with offline localStorage cache) ============================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtTime(sec){ sec = sec||0; const m=Math.floor(sec/60), s=Math.floor(sec%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

const CACHE_KEY = 'gamesCache';
function saveCache(sections, games){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ sections, games, ts: Date.now() })); }catch(e){}
}
function loadCache(){
  try{ return JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ return null; }
}
function setOfflineBanner(show){
  document.getElementById('offlineBanner').classList.toggle('hidden', !show);
}
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, rej)=> setTimeout(()=> rej(new Error('timeout')), ms))
  ]);
}

function loadAll(){
  const fetchPromise = Promise.all([
    db.ref('games_config/sections').once('value'),
    db.ref('games_config/games').once('value')
  ]);

  withTimeout(fetchPromise, 6000).then(([secSnap, gameSnap])=>{
    const sections = [];
    secSnap.forEach(c=> sections.push({ id:c.key, ...c.val() }));
    sections.sort((a,b)=>(a.order||0)-(b.order||0));

    const games = [];
    gameSnap.forEach(c=> games.push({ id:c.key, ...c.val() }));
    games.sort((a,b)=>(a.order||0)-(b.order||0));

    saveCache(sections, games);
    setOfflineBanner(false);
    renderSections(sections, games);
  }).catch(err=>{
    console.warn('live load failed, falling back to cache', err);
    const cached = loadCache();
    if(cached && cached.sections){
      setOfflineBanner(true);
      renderSections(cached.sections, cached.games || []);
    } else {
      document.getElementById('sectionsRoot').innerHTML = '<div class="empty-note">تعذّر تحميل بيانات الألعاب ولا توجد نسخة محفوظة محليًا بعد. تحقق من اتصالك بالإنترنت.</div>';
    }
  });
}

function gameCardHtml(g){
  const badge = g.givesBonus
    ? `<span class="badge bonus">🎁 يمنح Bonus</span>`
    : `<span class="badge nobonus">بدون Bonus</span>`;
  const lbBtn = g.hasLeaderboard
    ? `<button class="btn btn-lb" data-lb="${esc(g.leaderboardKey || (g.id+'_leaderboard'))}" data-name="${esc(g.name)}">🏆 المتصدرون</button>`
    : '';
  const media = g.image
    ? `<img class="thumb" src="${esc(g.image)}" alt="${esc(g.name)}" loading="lazy" onerror="this.outerHTML='<div class=icon>${esc(g.icon||'🎮')}</div>'">`
    : `<div class="icon">${esc(g.icon || '🎮')}</div>`;
  return `
  <div class="card">
    ${media}
    <div class="name">${esc(g.name)}</div>
    <div class="desc">${esc(g.desc || '')}</div>
    ${badge}
    <div class="card-actions">
      ${lbBtn}
      <a class="btn btn-play" href="${esc(g.url||'#')}">▶ ابدأ اللعب</a>
    </div>
  </div>`;
}

function renderSections(sections, games){
  const root = document.getElementById('sectionsRoot');
  if(!sections.length){ root.innerHTML = '<div class="empty-note">لا توجد أقسام بعد. أضِفها من لوحة التحكم.</div>'; return; }

  root.innerHTML = sections.map(sec=>{
    const secGames = games.filter(g=>g.sectionId===sec.id);
    const price = sec.price || 0;
    const unlocked = isUnlocked(sec.id, price);
    let body;
    if(!unlocked){
      body = `<div class="locked-card">
        <div class="lock-icon">🔒</div>
        <div>هذا القسم مقفل</div>
        <div class="price">السعر: ${price} 🪙</div>
        <button class="unlock-btn" data-unlock="${esc(sec.id)}" data-price="${price}">فتح القسم</button>
      </div>`;
    } else if(!secGames.length){
      body = `<div class="empty-note">لا توجد ألعاب في هذا القسم بعد.</div>`;
    } else {
      body = `<div class="grid">${secGames.map(gameCardHtml).join('')}</div>`;
    }
    return `<div class="section">
      <div class="section-head">
        <div class="section-title">${esc(sec.name)}</div>
        ${price>0 ? `<div class="section-lock-note">${unlocked?'✅ مفتوح':'🔒 يتطلب '+price+' 🪙'}</div>` : ''}
      </div>
      ${body}
    </div>`;
  }).join('');

  root.querySelectorAll('[data-unlock]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.unlock, price = parseFloat(btn.dataset.price)||0;
      if(unlockSection(id, price)){ loadAll(); }
      else { alert('رصيدك من الـ Bonus غير كافٍ لفتح هذا القسم.'); }
    });
  });
  root.querySelectorAll('[data-lb]').forEach(btn=>{
    btn.addEventListener('click', ()=> openLeaderboard(btn.dataset.lb, btn.dataset.name));
  });
}

/* ============================= LEADERBOARD MODAL ============================= */
function openLeaderboard(path, gameName){
  document.getElementById('lbModalTitle').textContent = `🏆 متصدرو ${gameName}`;
  const body = document.getElementById('lbModalBody');
  body.innerHTML = '<div class="lb-empty">جارِ التحميل...</div>';
  document.getElementById('lbModal').classList.remove('hidden');
  db.ref(path).orderByChild('time').limitToFirst(10).once('value').then(snap=>{
    const rows = [];
    snap.forEach(c=> rows.push(c.val()));
    rows.sort((a,b)=>(a.time||0)-(b.time||0));
    if(!rows.length){ body.innerHTML = '<div class="lb-empty">لا توجد نتائج بعد.</div>'; return; }
    body.innerHTML = rows.map((r,i)=>{
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
      return `<div class="lb-row"><span class="lb-rank">${medal}</span><span class="lb-name">${esc(r.name)}</span><span class="lb-time num">${fmtTime(r.time)}</span></div>`;
    }).join('');
  }).catch(()=>{ body.innerHTML = '<div class="lb-empty">تعذّر التحميل.</div>'; });
}
document.getElementById('lbModalClose').addEventListener('click', ()=> document.getElementById('lbModal').classList.add('hidden'));
document.getElementById('lbModal').addEventListener('click', (e)=>{ if(e.target.id==='lbModal') e.target.classList.add('hidden'); });

renderCoin();
loadAll();

})();
</script>
</body>
</html>
