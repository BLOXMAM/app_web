<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة التحديات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EEF2FF;
      --card-bg: #FFFFFF;
      --text: #1E1B4B;
      --subtext: #64748B;
      --w1: #F1F5F9;
      --w2: #E2E8F0;
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --danger: #DC2626;
      --danger-dark: #B91C1C;
      --warning: #D97706;
      --warning-dark: #B45309;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px 80px;
    }

    .page { width: 100%; max-width: 680px; }

    .page-header { text-align: center; margin-bottom: 30px; }
    .page-header h1 { font-size: 2rem; margin-bottom: 8px; }
    .page-header p { color: var(--subtext); font-size: 0.95rem; }

    .status-msg {
      text-align: center;
      color: var(--subtext);
      background: var(--card-bg);
      border: 1px dashed var(--w2);
      border-radius: 16px;
      padding: 26px;
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .chapter {
      background: var(--card-bg);
      border: 1px solid var(--w2);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px -8px rgba(30, 27, 75, 0.08);
    }

    .chapter-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--w2);
    }

    .chapter-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .lessons-list { display: flex; flex-direction: column; gap: 10px; }

    .lesson-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      background: var(--w1);
      border: 1.5px solid transparent;
      border-radius: 14px;
      padding: 15px 18px;
      transition: all 0.18s ease;
      cursor: pointer;
    }

    .lesson-name { font-size: 0.98rem; font-weight: 500; }
    .lesson-arrow { color: var(--subtext); font-size: 1rem; flex-shrink: 0; transition: transform 0.18s ease, color 0.18s ease; }

    .lesson-link:hover { background: #fff; border-color: var(--primary); box-shadow: 0 8px 16px -6px rgba(79, 70, 229, 0.25); transform: translateY(-1px); }
    .lesson-link:hover .lesson-arrow { transform: translateX(-3px); color: var(--primary); }
    .lesson-link:active { transform: translateY(0) scale(0.99); }

    .toast {
      position: fixed;
      bottom: -120px;
      left: 50%;
      transform: translateX(-50%) scale(0.92);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 22px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      max-width: min(90vw, 420px);
      transition: bottom 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    }

    .toast.show { bottom: 34px; opacity: 1; transform: translateX(-50%) scale(1); }
    .toast-icon { font-size: 1.25rem; line-height: 1; flex-shrink: 0; }
    .toast-text { line-height: 1.5; }
    .toast.toast-error { background: linear-gradient(135deg, var(--danger), var(--danger-dark)); }
    .toast.toast-warning { background: linear-gradient(135deg, var(--warning), var(--warning-dark)); }
  </style>

<div class="page">
  <div class="page-header">
    <h1>🎯 منصة التحديات</h1>
    <p>اختر ما تريد التحدي فيه وابدأ فورًا</p>
  </div>

  <div id="chapters-container">
    <p class="status-msg">جارٍ التحميل...</p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  // ====================================================================
  // عدّل هذه القيم الأربع لتطابق نفس القيم التي أدخلتها في لوحة التحكم.
  // لوحة التحكم تعرض لك هذا البلوك جاهزًا للنسخ بعد أول اتصال ناجح.
  // ====================================================================
  const CONFIG = {
    owner: 'BLOXMAM',
    repo: 'APP_WEB',
    branch: 'main',
    path: 'data/lessons.json'
  };

  function showToast(message, type, icon) {
    const toast = document.getElementById('toast');
    toast.innerHTML = `<span class="toast-icon">${icon}</span><span class="toast-text">${message}</span>`;
    toast.className = `toast toast-${type} show`;
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.innerText = str ?? '';
    return d.innerHTML;
  }

  function buildLessonEl(lesson) {
    const a = document.createElement('a');
    a.className = 'lesson-link';
    const href = lesson.href ?? '';
    a.setAttribute('href', href);
    a.innerHTML = `<span class="lesson-name">${escapeHtml(lesson.name)}</span><span class="lesson-arrow">‹</span>`;

    a.addEventListener('click', (e) => {
      if (href === 'false') {
        e.preventDefault();
        showToast('لا يمكن إنشاء تحدٍ لهذا الدرس', 'error', '❌');
      } else if (href === '') {
        e.preventDefault();
        showToast('لم يُضف تحدٍ لهذا الدرس بعد', 'warning', '⏳');
      }
    });
    return a;
  }

  function buildChapterEl(chapter, index) {
    const section = document.createElement('section');
    section.className = 'chapter';

    const h2 = document.createElement('h2');
    h2.className = 'chapter-title';
    h2.innerHTML = `<span class="chapter-badge">${index + 1}</span> ${escapeHtml(chapter.title)}`;

    const list = document.createElement('div');
    list.className = 'lessons-list';
    (chapter.lessons || []).forEach(lesson => list.appendChild(buildLessonEl(lesson)));

    section.appendChild(h2);
    section.appendChild(list);
    return section;
  }

  async function loadData() {
    const container = document.getElementById('chapters-container');
    try {
      const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.path}?t=${Date.now()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('not-found');
      const data = await res.json();

      container.innerHTML = '';
      if (!data.chapters || data.chapters.length === 0) {
        container.innerHTML = '<p class="status-msg">لا توجد فصول مضافة بعد. أضِف الفصول والدروس من لوحة التحكم.</p>';
        return;
      }
      data.chapters.forEach((ch, i) => container.appendChild(buildChapterEl(ch, i)));
    } catch (err) {
      container.innerHTML = `<p class="status-msg">
        تعذّر تحميل البيانات حاليًا 😕<br>
        تأكد من إعداد CONFIG في أعلى الكود، ومن نشر البيانات مرة واحدة على الأقل من لوحة التحكم.
      </p>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>


<script id="admin-scripts">
    const username = "BLOXMAM";
    const repo = "app_web";
    const currentFileName = "home.html";
    let APP_LOGO_ACTIVE = false;
    let appLogoLiveHtml = null;
    let currentPageTitle = null;

    function escLogoText(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function applyPageHeaderState() {
        const headerEl = document.getElementById("pageMainHeader");
        if (!headerEl) return;
        if (APP_LOGO_ACTIVE && appLogoLiveHtml) {
            headerEl.innerHTML = appLogoLiveHtml;
        } else if (!APP_LOGO_ACTIVE && currentPageTitle) {
            headerEl.innerText = currentPageTitle;
        }
    }

    function applyAppLogoConfig(cfg) {
        if (cfg && cfg.enabled && cfg.type === "text" && cfg.text) {
            APP_LOGO_ACTIVE = true;
            appLogoLiveHtml = escLogoText(cfg.text);
        } else if (cfg && cfg.enabled && cfg.type === "image" && (cfg.image_uploaded_path || cfg.image_url)) {
            const src = cfg.image_uploaded_path ? `https://raw.githubusercontent.com/${username}/${repo}/main/${cfg.image_uploaded_path}` : cfg.image_url;
            APP_LOGO_ACTIVE = true;
            appLogoLiveHtml = '<img src="' + src + '" alt="Logo" style="max-height:32px; max-width:160px; vertical-align:middle; display:inline-block;">';
        } else {
            APP_LOGO_ACTIVE = false;
            appLogoLiveHtml = null;
        }
        applyPageHeaderState();
    }

    async function fetchAppLogoConfig() {
        try {
            if (typeof Android !== "undefined" && Android.readLocalFile) {
                const localData = Android.readLocalFile("app_logo.json");
                if (localData && localData.trim() !== "") {
                    applyAppLogoConfig(JSON.parse(localData));
                    return;
                }
            }
            const res = await fetch(`app_logo.json?t=${Date.now()}`);
            if (res.ok) {
                applyAppLogoConfig(await res.json());
                return;
            }
            throw new Error();
        } catch(e) {
            try {
                const resAlt = await fetch(`https://raw.githubusercontent.com/${username}/${repo}/main/app_logo.json?t=${Date.now()}`);
                if (resAlt.ok) applyAppLogoConfig(await resAlt.json());
            } catch(err) { console.log("خطأ في جلب إعدادات لوجو التطبيق"); }
        }
    }

    function initUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const saved = localStorage.getItem("user-theme") || "light";
        if(saved === "dark") {
            document.documentElement.setAttribute("data-user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            document.documentElement.removeAttribute("data-user-theme");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        }
    }

    function toggleUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const current = document.documentElement.getAttribute("data-user-theme");
        if(current === "dark") {
            document.documentElement.removeAttribute("data-user-theme");
            localStorage.setItem("user-theme", "light");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
            document.documentElement.setAttribute("data-user-theme", "dark");
            localStorage.setItem("user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
    }

    function toggleDrawer() {
        const drawer = document.getElementById("drawer");
        const overlay = document.getElementById("drawerOverlay");
        const menuBtn = document.getElementById("menuBtnToggle");
        
        drawer.classList.toggle("open");
        
        if(drawer.classList.contains("open")) {
            overlay.style.display = "block";
            menuBtn.classList.add("active-icon");
        } else {
            overlay.style.display = "none";
            menuBtn.classList.remove("active-icon");
        }
    }

    function renderDrawerContent(orderedPages) {
        const drawerMenu = document.getElementById("drawerDynamicMenu");
        drawerMenu.innerHTML = "";
        const currentPageData = orderedPages.find(p => p.file === currentFileName);
        if (currentPageData && currentPageData.title) {
            currentPageTitle = currentPageData.title;
            applyPageHeaderState();
            if(document.getElementById("drawerSideHeader")) document.getElementById("drawerSideHeader").innerText = currentPageData.title;
            if(document.getElementById("pageContentTitle")) document.getElementById("pageContentTitle").innerText = currentPageData.title;
            document.title = currentPageData.title;
        }
        const bottomNavList = document.getElementById("bottomNavbarList");
        if (bottomNavList) bottomNavList.innerHTML = "";
        const goToPage = (file) => {
            if (typeof Android !== "undefined" && Android.openLocalPage) {
                Android.openLocalPage(file);
            } else {
                window.location.href = file;
            }
        };
        orderedPages.forEach(page => {
            if (page.hidden) return;
            const isCurrent = (page.file === currentFileName);
            const li = document.createElement("li");
            li.className = "drawer-item";
            li.innerHTML = "<span>" + page.title + "</span>";
            li.onclick = () => { if (!isCurrent) goToPage(page.file); };
            drawerMenu.appendChild(li);

            if (bottomNavList) {
                const navLi = document.createElement("li");
                navLi.className = "bottom-navbar-item" + (isCurrent ? " active" : "");
                const iconName = page.icon || "fa-solid fa-file";
                navLi.innerHTML = "<i class=\"" + iconName + "\"></i><span>" + page.title + "</span>";
                navLi.onclick = () => { if (!isCurrent) goToPage(page.file); };
                bottomNavList.appendChild(navLi);
            }
        });
        if (bottomNavList) {
            const activeNavItem = bottomNavList.querySelector(".bottom-navbar-item.active");
            if (activeNavItem) {
                setTimeout(() => {
                    activeNavItem.scrollIntoView({ behavior: "auto", inline: "center", block: "nearest" });
                }, 0);
            }
        }
    }

    async function loadGlobalVars() {
        try {
            const res = await fetch("var.json");
            if(res.ok) {
                const data = await res.json();
                const styleEl = document.createElement("style");
                let cssStr = ":root {\n";
                for(let k in data.light) { cssStr += `  ${k}: ${data.light[k]};\n`; }
                cssStr += "}\n[data-user-theme='dark'] {\n";
                for(let k in data.dark) { cssStr += `  ${k}: ${data.dark[k]};\n`; }
                cssStr += "}";
                styleEl.innerHTML = cssStr;
                document.head.appendChild(styleEl);
            }
        } catch(e) { console.log("خطأ في تطبيق المتغيرات العامة"); }
    }

    async function initDrawer() {
        initUserTheme();
        await loadGlobalVars();
        const loader = document.getElementById("drawerLoader");
        let loadedSuccessfully = false;
        try {
            if (typeof Android !== "undefined" && Android.readLocalFile) {
                const localData = Android.readLocalFile("order.json");
                if (localData && localData.trim() !== "") {
                    const orderedPages = JSON.parse(localData);
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                }
            }
            if (!loadedSuccessfully) {
                const res = await fetch(`order.json`);
                if (res.ok) {
                    const orderedPages = await res.json();
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                } else { throw new Error(); }
            }
        } catch(e) { 
            if (!loadedSuccessfully) {
                try {
                    const resAlt = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/order.json`);
                    const dataAlt = await resAlt.json();
                    const decodedContent = decodeURIComponent(escape(atob(dataAlt.content.replace(/\s/g, ""))));
                    renderDrawerContent(JSON.parse(decodedContent));
                } catch(err) { console.log("خطأ في جلب الهيدر"); }
            }
        } finally {
            if(loader) loader.style.display = "none";
        }
    }
    initDrawer();
    fetchAppLogoConfig();
